[build-system]
requires = ["flit_core==3.12.0"]
build-backend = "flit_core.buildapi"

[project]
name = "recap-for-everyone"
dynamic = ["version"]
description = "Local-only archive import, inspection, search and checked title workflows"
requires-python = ">=3.10"
classifiers = ["Private :: Do Not Upload"]

[project.scripts]
recap = "recaplib.cli:main"

[tool.flit.module]
name = "recaplib"
